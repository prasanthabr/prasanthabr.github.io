# -- Navigation --
# `main` renders in the header, `footer` on the left of the footer. Browse-by
# taxonomy links are generated from the registered taxonomies and do not
# belong here — that is what let /domains/literature/ rot into a 404.

# /now/ is the synthesis layer — where I've got to, linking down to the notes
# underneath. It carries the weight the individual notes are excused from, so
# it belongs in the header, not buried in the footer.
[[main]]
  name = "Now"
  url = "/now/"
  weight = 10

[[main]]
  name = "Archive"
  url = "/notes/"
  weight = 20

[[main]]
