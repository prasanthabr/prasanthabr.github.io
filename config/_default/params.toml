# -- Site parameters --
# Every param the layouts read is listed here. If a template needs a value,
# it belongs in this file rather than in the template.

author = "Prasanth"
label = "prasanthabr"                     # header brand text
description = "A learning journal — Salesforce and the consulting craft around it, and the business and money side of building things."

dateFormat = ":date_medium"               # Go time layout or a Hugo :date_* token
defaultTheme = "light"                    # pre-JS fallback; theme.js then follows the OS
disableThemeToggle = false

# Sections whose pages appear on the home index. With the flat structure this
# is just "notes"; it is a list so a second stream can be added without a
# template change.
mainSections = ["notes"]

# Reading time is hidden below this word count — "1 min read" on an eight-line
# note is noise, and short notes are the point of this site.
readingTimeMinWords = 400

relatedCount = 4

# Cookieless analytics beacon. Commented out = the page makes no third-party
# request and sets no cookie. Cloudflare still counts traffic at the edge
# regardless — the privacy page says so. See layouts/_partials/analytics.html.
# [analytics]
#   provider = "cloudflare"    # or "goatcounter", "plausible"
#   site     = "<token>"       # cf beacon token / gc subdomain / plausible domain

webmanifest = "/site.webmanifest"

# Contact / profile links, rendered in the footer. Empty by default —
# uncomment what you actually want public. Any label and URL works; the
# footer just lists them.
# [[social]]
#   name = "GitHub"
#   url  = "https://github.com/prasanthabr"
# [[social]]
#   name = "Email"
#   url  = "mailto:you@example.com"

# Favicons and touch icons, emitted in order by _partials/head.html.
# Add a size by adding a row; nothing else to change.
[[icons]]
  rel = "icon"
  type = "image/x-icon"
  href = "/favicon.ico"
[[icons]]
  rel = "icon"
  type = "image/png"
  sizes = "16x16"
  href = "/favicon-16x16.png"
[[icons]]
  rel = "icon"
  type = "image/png"
  sizes = "32x32"
  href = "/favicon-32x32.png"
[[icons]]
  rel = "apple-touch-icon"
  sizes = "180x180"
  href = "/apple-touch-icon.png"
